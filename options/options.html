<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prism Settings</title>
  <style>
    :root {
      --bg: #1e1e2e; --surface: #181825; --border: #313244;
      --text: #cdd6f4; --text-muted: #6c7086; --accent: #89b4fa;
      --font: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fff; --surface: #f6f8fa; --border: #d0d7de; --text: #24292f; --text-muted: #6e7781; --accent: #0550ae; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13.5px; }
    .options-wrap { max-width: 560px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 20px; color: var(--accent); margin-bottom: 28px; }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
    .option-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .option-row:last-child { border-bottom: none; }
    .option-label { font-size: 13px; }
    .option-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    select, input[type=number] {
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); font-family: var(--font); font-size: 12.5px; padding: 4px 8px; outline: none;
    }
    input[type=number] { width: 60px; }
    input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
    .save-btn {
      background: var(--accent); border: none; border-radius: 6px; color: #1e1e2e;
      cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 600;
      padding: 10px 24px; margin-top: 8px; transition: opacity 0.15s;
    }
    .save-btn:hover { opacity: 0.85; }
    .saved-msg { color: var(--accent); font-size: 12px; margin-left: 12px; opacity: 0; transition: opacity 0.3s; }
    .saved-msg.show { opacity: 1; }
    .footer-row { display: flex; align-items: center; margin-top: 12px; }
  </style>
</head>
<body>
<div class="options-wrap">
  <h1>Prism Settings</h1>

  <div class="section">
    <div class="section-title">Appearance</div>
    <div class="option-row">
      <div>
        <div class="option-label">Default Theme</div>
        <div class="option-desc">Override auto OS-detection</div>
      </div>
      <select id="opt-theme">
        <option value="auto">Auto (OS)</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="option-row">
      <div>
        <div class="option-label">Show Line Numbers</div>
      </div>
      <input type="checkbox" id="opt-lines" checked>
    </div>
    <div class="option-row">
      <div>
        <div class="option-label">Show Path Bar</div>
        <div class="option-desc">Shows JSON path on hover at the bottom</div>
      </div>
      <input type="checkbox" id="opt-pathbar" checked>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Behaviour</div>
    <div class="option-row">
      <div>
        <div class="option-label">Auto-collapse Depth</div>
        <div class="option-desc">Nodes deeper than this collapse by default</div>
      </div>
      <input type="number" id="opt-depth" value="3" min="0" max="20">
    </div>
    <div class="option-row">
      <div>
        <div class="option-label">Sort Keys by Default</div>
      </div>
      <input type="checkbox" id="opt-sort">
    </div>
  </div>

  <div class="footer-row">
    <button class="save-btn" id="save-btn">Save Settings</button>
    <span class="saved-msg" id="saved-msg">Saved!</span>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
